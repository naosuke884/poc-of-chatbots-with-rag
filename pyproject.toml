[project]
name = "rag-poc"
version = "0.1.0"
description = "ベクトル埋め込み方式と PageIndex 方式を比較する RAG チャットボットの PoC"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
